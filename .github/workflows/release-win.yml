name: Build and Release Windows x64

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.15)'
        required: true
        default: '0.5.15'

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set release version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Check Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path electron/assets/icon.ico)) { throw 'electron/assets/icon.ico is missing' }
          if ((Get-Item electron/assets/icon.ico).Length -lt 10000) { throw 'electron/assets/icon.ico looks truncated' }
      - name: Package Windows app
        run: npm run pack:win-x64
      - name: Build NSIS installer (asar)
        run: npm run dist:win
      - name: Verify and archive
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $exe = 'dist/CIKE-win32-x64/CIKE.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $info = (Get-Item $exe).VersionInfo
          "CIKE.exe $($info.ProductName) $($info.ProductVersion)"
          if ($info.ProductVersion -notlike "$env:RELEASE_VERSION*") { throw 'packaged version does not match input' }
          $setup = "dist-installer/CIKE-Setup-$env:RELEASE_VERSION-x64.exe"
          if (-not (Test-Path $setup)) { throw "missing $setup" }
          if (-not (Test-Path 'dist-installer/win-unpacked/resources/app.asar')) { throw 'app.asar missing' }
          $zip = "CIKE-$env:RELEASE_VERSION-win-x64.zip"
          Compress-Archive -Path 'dist/CIKE-win32-x64' -DestinationPath $zip -CompressionLevel Optimal
          (Get-Item $zip).Length
          $sums = @()
          foreach ($f in $zip, $setup) {
            $sums += "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $sums | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CIKE v${{ inputs.version }}
          append_body: true
          make_latest: true
          body: |
            Windows x64 两种包：
            - `CIKE-Setup-版本号-x64.exe`：向导式安装程序（可改安装目录、建开始菜单/桌面快捷方式、可在「应用和功能」卸载，卸载保留环境数据）。
            - `CIKE-版本号-win-x64.zip`：免安装，解压后双击 `CIKE.exe`。
            首次运行如被 SmartScreen 拦截，选择「更多信息 → 仍要运行」。
            未做代码签名；指纹浏览器内核在设置页一次性下载（约 200 MB）。
            校验：`SHA256SUMS.txt`。
          files: |
            CIKE-*-win-x64.zip
            CIKE-Setup-*-x64.exe
            CIKE-Setup-*-x64.exe.blockmap
            latest.yml
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
